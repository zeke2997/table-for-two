# Cloudflare Pages 配置。自己部署一份时，把 name 换成你的项目名，
# 两个 id 换成 `wrangler d1 create` / `wrangler kv namespace create` 输出的值。
name = "zeke-shitang"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "table-for-two"
database_id = "4a4cdfeb-42de-4ede-b015-c99794698c0c"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PHOTOS"
id = "483a409e29df4c83a3af92c7a4fdcbcb"
